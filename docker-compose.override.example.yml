# Machine-specific changes to docker-compose.yml.
#
# Copy this file to `docker-compose.override.yml` and keep only the parts you
# need. Compose reads that name automatically and merges it over the tracked
# `docker-compose.yml`, so the tracked file stays exactly as shipped and a
# `git pull` never collides with your edits. The override is gitignored.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Lists of volumes merge by mount target: an entry here replaces the one in
# docker-compose.yml with the same target and leaves the others alone.

services:
  yt_worker:
    volumes:
      # Where finished downloads are kept, when save_to_storage is on.
      - "/data/downloads:/filestorage"
    # A ceiling the kernel enforces, so a runaway download is killed instead of
    # the host. Setting memswap_limit to the same value forbids swap here.
    # mem_limit: 512m
    # memswap_limit: 512m

  # yt_bot:
  #   mem_limit: 256m
  #   memswap_limit: 256m

# Size of the staging area for in-flight downloads. As shipped it is a tmpfs, so
# it lives in RAM — keep this below the memory the host can spare.
#
# Changing it does not resize an existing volume: Docker only creates one that
# does not exist yet. Remove it once, and that volume only, because pgdata holds
# the task history:
#
#   docker compose down
#   docker volume rm "${COMPOSE_PROJECT_NAME:-yt}_shared-tmpfs"
#   docker compose up -d
volumes:
  shared-tmpfs:
    driver_opts:
      o: "size=2048m,uid=1000"

# To stage on disk instead of in RAM, leave the volume above alone and mount a
# host directory over the same path in both services that use it. The bind
# replaces the volume by mount target, so shared-tmpfs is simply left unused —
# nothing to remove, nothing to recreate. Create the directory first.
#
# services:
#   yt_bot:
#     volumes:
#       - "/var/lib/yt-dlp-bot/staging:/tmp/download_tmpfs"
#   yt_worker:
#     volumes:
#       - "/var/lib/yt-dlp-bot/staging:/tmp/download_tmpfs"
